<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WhaBoost — Tableau de bord</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{--ink:#0e1c16;--teal:#0b6b4f;--teal-dark:#073d2c;--paper:#f5f7f2;--border:#dde6e0;--gray:#5c6d64;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);}
  header{background:#fff;border-bottom:1px solid var(--border);padding:16px 28px;display:flex;justify-content:space-between;align-items:center;}
  header h1{font-family:'Space Grotesk',sans-serif;font-size:18px;margin:0;}
  header button{background:none;border:1.5px solid var(--border);padding:8px 16px;border-radius:99px;cursor:pointer;font-weight:600;font-size:13px;}
  main{max-width:960px;margin:32px auto;padding:0 20px;}
  .card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:20px;}
  .card h2{font-size:16px;margin:0 0 14px;}
  form.inline{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
  form.inline input{flex:1;min-width:160px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--border);font-size:14px;}
  form.inline button{background:var(--teal);color:#fff;border:none;padding:10px 18px;border-radius:10px;font-weight:700;cursor:pointer;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border);}
  th{color:var(--gray);font-weight:600;font-size:12px;text-transform:uppercase;}
  .empty{color:var(--gray);font-size:13.5px;padding:14px 0;}
  .status{padding:20px;text-align:center;color:var(--gray);}
</style>
</head>
<body>

<header>
  <h1>Wha<span style="color:var(--teal);">Boost</span> — Tableau de bord</h1>
  <button onclick="logout()">Se déconnecter</button>
</header>

<main>
  <div id="statusBox" class="status">Chargement de ta session…</div>

  <div id="appContent" style="display:none;">
    <div class="card">
      <h2>Ajouter un contact</h2>
      <form class="inline" id="contactForm">
        <input type="text" id="cName" placeholder="Nom complet" required />
        <input type="tel" id="cPhone" placeholder="Numéro WhatsApp (ex. +229...)" required />
        <input type="email" id="cEmail" placeholder="Email (optionnel)" />
        <button type="submit">Ajouter</button>
      </form>
      <div id="contactMsg" class="empty"></div>
    </div>

    <div class="card">
      <h2>Mes contacts</h2>
      <table>
        <thead><tr><th>Nom</th><th>Téléphone</th><th>Email</th><th>Ajouté le</th></tr></thead>
        <tbody id="contactsBody"></tbody>
      </table>
      <div id="contactsEmpty" class="empty" style="display:none;">Aucun contact pour l'instant — ajoute le premier ci-dessus.</div>
    </div>
  </div>
</main>

<script>
// À adapter une fois le backend déployé sur Render (ex. https://whaboost-backend.onrender.com)
const BACKEND_URL = 'http://localhost:10000';
const SUPABASE_URL = 'https://eloklrhoqqesbcqbtidz.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsb2tscmhvcXFlc2JjcWJ0aWR6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MjM4NzUsImV4cCI6MjEwNDk5OTg3NX0.aQtZKneDEIXuxARe1kwgBxQgDRR2itfzhpk7psgcKB8';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let accessToken = null;

async function init(){
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) {
    document.getElementById('statusBox').textContent = 'Session expirée — retourne sur le site pour te reconnecter.';
    return;
  }
  accessToken = session.access_token;
  document.getElementById('statusBox').style.display = 'none';
  document.getElementById('appContent').style.display = 'block';
  loadContacts();
}

async function api(path, options = {}) {
  const res = await fetch(`${BACKEND_URL}${path}`, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      Authorization: `Bearer ${accessToken}`,
      ...(options.headers || {}),
    },
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || `Erreur ${res.status}`);
  }
  return res.status === 204 ? null : res.json();
}

async function loadContacts(){
  try {
    const { contacts } = await api('/api/contacts');
    const tbody = document.getElementById('contactsBody');
    const empty = document.getElementById('contactsEmpty');
    tbody.innerHTML = '';
    if (!contacts.length) { empty.style.display = 'block'; return; }
    empty.style.display = 'none';
    contacts.forEach(c => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${c.full_name}</td><td>${c.phone_number}</td><td>${c.email || '—'}</td><td>${new Date(c.created_at).toLocaleDateString('fr-FR')}</td>`;
      tbody.appendChild(tr);
    });
  } catch (err) {
    document.getElementById('contactsEmpty').style.display = 'block';
    document.getElementById('contactsEmpty').textContent = 'Impossible de charger les contacts : ' + err.message;
  }
}

document.getElementById('contactForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('contactMsg');
  try {
    await api('/api/contacts', {
      method: 'POST',
      body: JSON.stringify({
        full_name: document.getElementById('cName').value.trim(),
        phone_number: document.getElementById('cPhone').value.trim(),
        email: document.getElementById('cEmail').value.trim() || null,
      }),
    });
    document.getElementById('contactForm').reset();
    msg.textContent = 'Contact ajouté.';
    loadContacts();
  } catch (err) {
    msg.textContent = 'Erreur : ' + err.message;
  }
});

async function logout(){
  await supabaseClient.auth.signOut();
  window.location.href = 'whaboost-site.html';
}

init();
</script>
</body>
</html>
